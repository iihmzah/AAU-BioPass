
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AAU-BioPass | Edit Student</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
        }

        h1 {
            color: #163b65;
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 16px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            box-sizing: border-box;
            width: 100%;
            padding: 11px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            margin-top: 24px;
            padding: 12px 18px;
            background: #163b65;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #163b65;
            text-decoration: none;
        }

        .message {
            padding: 12px;
            margin-bottom: 12px;
            border-radius: 6px;
            background: #edf3f9;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Edit Student</h1>
        <p>Update the student's university information.</p>

        {% if messages %}
            {% for message in messages %}
                <div class="message">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <label for="student_number">University Number *</label>
            <input
                type="text"
                id="student_number"
                name="student_number"
                maxlength="20"
                value="{{ student.student_number }}"
                required
            >

            <label for="full_name">Full Name *</label>
            <input
                type="text"
                id="full_name"
                name="full_name"
                maxlength="150"
                value="{{ student.full_name }}"
                required
            >

            <label for="email">University Email</label>
            <input
                type="email"
                id="email"
                name="email"
                value="{{ student.email }}"
            >

            <label for="college">College *</label>
            <input
                type="text"
                id="college"
                name="college"
                maxlength="100"
                value="{{ student.college }}"
                required
            >

            <label for="major">Major *</label>
            <input
                type="text"
                id="major"
                name="major"
                maxlength="100"
                value="{{ student.major }}"
                required
            >

            <button type="submit">Update Student</button>
        </form>

        <a class="back-link" href="/students/">Back to Students</a>
    </div>
</body>
</html>
